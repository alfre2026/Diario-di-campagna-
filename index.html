<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quaderno — diario tecnico di campo</title>
<style>
:root{
  --carta:#E9EAE3; --carta-2:#F3F4EE; --riga:#CFD2C6; --riga-forte:#AFB4A6;
  --inchiostro:#1C2321; --inchiostro-2:#5D6660;
  --sanguigna:#8C1D2F; --oliva:#4A5D3A; --ocra:#A9761B;
  --ombra:0 1px 0 rgba(28,35,33,.10), 0 6px 18px -12px rgba(28,35,33,.45);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--carta);color:var(--inchiostro);font-family:var(--sans);font-size:16px;line-height:1.45;padding-bottom:96px;overscroll-behavior-y:contain}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--sanguigna);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* schede a linguetta principali */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--inchiostro);margin-bottom:10px}
.tab{flex:1;padding:9px 6px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--inchiostro-2);border:1px solid var(--riga);border-bottom:none;border-radius:3px 3px 0 0;background:var(--carta);margin-right:3px}
.tab:last-child{margin-right:0}
.tab.on{background:var(--inchiostro);color:var(--carta);border-color:var(--inchiostro);font-weight:600}

header.top{position:sticky;top:0;z-index:40;background:linear-gradient(var(--carta) 80%, rgba(233,234,227,0));padding-top:env(safe-area-inset-top)}
.titolo-riga{display:flex;align-items:baseline;gap:10px;padding:12px 0 8px}
.titolo{font-family:var(--serif);font-size:23px;font-weight:400;letter-spacing:-.2px;margin:0}
.titolo em{font-style:normal;color:var(--sanguigna)}
.conta{font-family:var(--mono);font-size:11px;color:var(--inchiostro-2);letter-spacing:.06em;margin-left:auto}
.icona-btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--inchiostro-2);
  border:1px solid var(--riga-forte);border-radius:2px;padding:5px 8px;background:var(--carta-2)}
.icona-btn:active{background:var(--riga)}

.cerca-box{position:relative;margin-bottom:8px}
.cerca{width:100%;padding:11px 34px 11px 32px;background:var(--carta-2);border:1px solid var(--riga-forte);border-radius:2px;font-size:16px}
.cerca::placeholder{color:#9AA096}
.cerca-lente{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--inchiostro-2);font-size:14px}
.cerca-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 8px;color:var(--inchiostro-2);font-size:15px}

.nastro{display:flex;border:1px solid var(--riga-forte);background:var(--carta-2);margin-bottom:10px;border-radius:2px;overflow:hidden}
.mese{flex:1 1 0;min-width:0;padding:5px 0 4px;text-align:center;border-right:1px solid var(--riga);transition:background .12s}
.mese:last-child{border-right:none}
.mese .sigla{font-family:var(--mono);font-size:9.5px;color:var(--inchiostro-2);display:block;text-transform:uppercase}
.mese .barra{height:3px;margin:3px 4px 0;background:var(--riga);border-radius:2px}
.mese[data-pieno="1"] .barra{background:var(--oliva)}
.mese[data-pieno="2"] .barra{background:var(--sanguigna)}
.mese.on{background:var(--inchiostro)}
.mese.on .sigla{color:var(--carta)}
.mese.on .barra{background:var(--carta)}
.mese.oggi .sigla::after{content:"·";color:var(--sanguigna);font-weight:700}

.filtri{margin-bottom:6px}
.riga-f{display:flex;gap:6px;overflow-x:auto;padding:3px 0 7px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.riga-f::-webkit-scrollbar{display:none}
.etichetta-f{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--inchiostro-2);padding:2px 0 1px}
.chip{flex:0 0 auto;padding:6px 11px;border:1px solid var(--riga-forte);border-radius:14px;background:var(--carta-2);
  font-size:13.5px;white-space:nowrap;color:var(--inchiostro-2);transition:all .12s}
.chip.on{background:var(--inchiostro);border-color:var(--inchiostro);color:var(--carta);font-weight:500}
.chip.col.on{background:var(--c,var(--oliva));border-color:var(--c,var(--oliva))}
.chip .pallino{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--c,var(--oliva))}
.chip.on .pallino{background:rgba(255,255,255,.9)}
.chip .n{font-family:var(--mono);font-size:10.5px;opacity:.65;margin-left:5px}

.raggr{display:flex;align-items:center;gap:8px;border-top:1px solid var(--riga);border-bottom:1px solid var(--riga);padding:7px 0;margin-bottom:14px;flex-wrap:wrap}
.raggr label{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--inchiostro-2)}
.sel{background:transparent;border:none;border-bottom:1px solid var(--riga-forte);padding:2px 18px 2px 2px;font-size:13.5px;border-radius:0;
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--inchiostro-2) 50%),linear-gradient(135deg,var(--inchiostro-2) 50%,transparent 50%);
  background-position:calc(100% - 8px) 52%,calc(100% - 4px) 52%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.azzera{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--sanguigna)}

.divisorio{display:flex;align-items:flex-end;margin:26px 0 10px}
.divisorio:first-child{margin-top:4px}
.linguetta{background:var(--inchiostro);color:var(--carta);padding:5px 12px 5px 11px;border-radius:2px 9px 0 0;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;max-width:74%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linguetta.tinta{background:var(--c)}
.coda{flex:1;border-bottom:2px solid var(--inchiostro);height:2px}
.coda.tinta{border-color:var(--c)}
.n-gruppo{font-family:var(--mono);font-size:10px;color:var(--inchiostro-2);padding:0 0 3px 8px}
.sotto-gruppo{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--inchiostro-2);
  margin:16px 0 7px;border-left:2px solid var(--riga-forte);padding:1px 0 1px 8px}

.scheda{display:flex;background:var(--carta-2);border:1px solid var(--riga);border-radius:2px;margin-bottom:8px;
  box-shadow:var(--ombra);overflow:hidden;width:100%;text-align:left;transition:transform .1s}
.scheda:active{transform:scale(.994)}
.spina{flex:0 0 5px;background:var(--c,var(--oliva))}
.corpo-s{flex:1;min-width:0;padding:10px 12px 11px}
.meta{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;color:var(--inchiostro-2);text-transform:uppercase;margin-bottom:3px;flex-wrap:wrap}
.meta .tipo{color:var(--inchiostro);font-weight:600}
.meta .pin{color:var(--ocra)}
.tit-s{font-family:var(--serif);font-size:17px;line-height:1.25;margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.estratto{font-size:13.5px;color:var(--inchiostro-2);line-height:1.4;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag-riga{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:2px;background:var(--carta);border:1px solid var(--riga);color:var(--inchiostro-2)}
.tag.avv{border-color:rgba(140,29,47,.35);color:var(--sanguigna);background:rgba(140,29,47,.05)}
.tag.fase{border-color:rgba(169,118,27,.4);color:var(--ocra);background:rgba(169,118,27,.06)}
.tag.graffa{border-style:dashed}
mark{background:rgba(169,118,27,.28);color:inherit;padding:0 1px;border-radius:1px}

.vuoto{border:1px dashed var(--riga-forte);border-radius:3px;padding:26px 18px;text-align:center;margin-top:18px}
.vuoto p{margin:0 0 4px;font-family:var(--serif);font-size:16px}
.vuoto small{color:var(--inchiostro-2);font-size:13px}

.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:45;background:var(--sanguigna);color:#fff;
  border-radius:26px;padding:14px 20px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  box-shadow:0 8px 22px -8px rgba(140,29,47,.75)}
.fab:active{transform:translateY(1px)}
.fab[hidden]{display:none}

.pannello{position:fixed;inset:0;z-index:60;background:var(--carta);overflow-y:auto;padding-bottom:120px;-webkit-overflow-scrolling:touch}
.pannello[hidden]{display:none}
.barra-p{position:sticky;top:0;z-index:10;background:var(--carta);border-bottom:1px solid var(--riga);display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.barra-p .indietro{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--inchiostro-2)}
.barra-p .titolo-p{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 auto}
.barra-p .salva{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--sanguigna);padding:7px 13px;border-radius:2px}

.testata{padding:18px 0 14px;border-bottom:2px solid var(--inchiostro)}
.testata .tipo-d{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sanguigna)}
.testata h2{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.15;margin:6px 0 10px}
.dati{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px;margin-top:12px}
.dati dt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--inchiostro-2);padding-top:3px}
.dati dd{margin:0}
.sez{margin-top:24px}
.sez h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--inchiostro-2);
  margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--riga)}
.testo{white-space:pre-wrap;font-size:15.5px;line-height:1.62}
table.mix{width:100%;border-collapse:collapse;font-size:14px}
table.mix th{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--inchiostro-2);
  text-align:left;padding:4px 6px;border-bottom:1px solid var(--riga-forte);font-weight:400}
table.mix td{padding:7px 6px;border-bottom:1px solid var(--riga);vertical-align:top}
table.mix td.dose{font-family:var(--mono);white-space:nowrap;text-align:right}
.allegato{background:var(--carta-2);border:1px solid var(--riga);border-left:3px solid var(--ocra);border-radius:2px;padding:10px 12px;margin-bottom:8px}
.allegato .a-tit{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;display:flex;gap:8px;align-items:baseline}
.allegato .a-tit .a-data{color:var(--inchiostro-2);font-size:9.5px;margin-left:auto}
.allegato .a-testo{white-space:pre-wrap;font-size:14.5px;line-height:1.55}
.azioni-d{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px;padding-top:16px;border-top:1px solid var(--riga)}
.azioni-d button{border:1px solid var(--riga-forte);background:var(--carta-2);padding:9px 13px;border-radius:2px;
  font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.azioni-d button.pericolo{color:var(--sanguigna);border-color:rgba(140,29,47,.45)}

.campo{margin-bottom:15px}
.campo > label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--inchiostro-2);margin-bottom:5px}
.campo input[type=text],.campo input[type=date],.campo input[type=number],.campo textarea,.campo select{
  width:100%;padding:10px 11px;background:var(--carta-2);border:1px solid var(--riga-forte);border-radius:2px;font-size:16px;-webkit-appearance:none;appearance:none}
.campo textarea{min-height:130px;line-height:1.55;resize:vertical}
.campo select{background-image:linear-gradient(45deg,transparent 50%,var(--inchiostro-2) 50%),linear-gradient(135deg,var(--inchiostro-2) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 11px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.due{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tre{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.scelte{display:flex;flex-wrap:wrap;gap:6px}
.scelta{padding:7px 11px;border:1px solid var(--riga-forte);border-radius:14px;background:var(--carta-2);font-size:13.5px;color:var(--inchiostro-2)}
.scelta.on{background:var(--inchiostro);color:var(--carta);border-color:var(--inchiostro)}
.scelta.on.avv{background:var(--sanguigna);border-color:var(--sanguigna)}
.scelta.on.fase{background:var(--ocra);border-color:var(--ocra)}
.riga-mix{display:grid;grid-template-columns:1fr 74px 62px 32px;gap:6px;margin-bottom:6px;align-items:center}
.riga-mix input{padding:8px 9px!important;font-size:15px!important}
.mini{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--riga-forte);
  padding:7px 11px;border-radius:2px;color:var(--inchiostro-2);width:100%;background:var(--carta-2)}
.togli{color:var(--sanguigna);font-size:19px;text-align:center;line-height:1}
.suggerimento{font-size:12px;color:var(--inchiostro-2);margin-top:5px;line-height:1.35}
.blocco-alleg{border:1px solid var(--riga);border-left:3px solid var(--ocra);background:var(--carta-2);padding:10px;border-radius:2px;margin-bottom:8px}

.voce-imp{display:flex;align-items:center;gap:10px;width:100%;padding:14px 2px;border-bottom:1px solid var(--riga);text-align:left}
.voce-imp .vi-t{font-size:15px}
.voce-imp .vi-s{font-size:12.5px;color:var(--inchiostro-2);margin-top:2px}
.voce-imp .frecc{margin-left:auto;color:var(--inchiostro-2);font-family:var(--mono);font-size:13px}
.nota-p{background:var(--carta-2);border:1px solid var(--riga);border-radius:2px;padding:12px;font-size:13px;color:var(--inchiostro-2);line-height:1.5;margin-top:18px}
.lista-cat{margin-top:10px}
.el-cat{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--riga);font-size:14.5px}
.el-cat .p{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:var(--c,var(--oliva))}
.el-cat .x{margin-left:auto;color:var(--sanguigna);font-size:17px;padding:2px 8px}
.aggiungi-cat{display:flex;gap:6px;margin-top:12px}
.aggiungi-cat input{flex:1;padding:9px 10px;background:var(--carta-2);border:1px solid var(--riga-forte);border-radius:2px;font-size:16px}
.aggiungi-cat button{background:var(--inchiostro);color:var(--carta);padding:0 15px;border-radius:2px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--inchiostro);color:var(--carta);
  padding:10px 16px;border-radius:3px;font-size:13.5px;z-index:90;box-shadow:0 10px 26px -10px rgba(0,0,0,.6);max-width:88%;text-align:center}
.toast[hidden]{display:none}

/* ============ CONSULTORIO ============ */
.briciole{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--inchiostro-2);
  padding:10px 0 4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.briciole button{color:var(--sanguigna);font-family:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit}
.griglia-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.card-col{border:1px solid var(--riga);background:var(--carta-2);border-radius:2px;padding:14px 12px;text-align:left;
  border-top:4px solid var(--c,var(--oliva));box-shadow:var(--ombra)}
.card-col .cc-n{font-family:var(--serif);font-size:18px;line-height:1.2;display:block}
.card-col .cc-s{font-family:var(--mono);font-size:10px;color:var(--inchiostro-2);text-transform:uppercase;letter-spacing:.06em;margin-top:5px;display:block}
.el-lista{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 2px;border-bottom:1px solid var(--riga)}
.el-lista .rango{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;border-radius:2px;flex:0 0 auto}
.r1{background:var(--sanguigna);color:#fff}
.r2{background:rgba(169,118,27,.18);color:var(--ocra);border:1px solid rgba(169,118,27,.45)}
.r3{background:var(--carta-2);color:var(--inchiostro-2);border:1px solid var(--riga-forte)}
.el-lista .nome-a{flex:1;min-width:0}
.el-lista .nome-a b{font-weight:500;font-size:15.5px;display:block;line-height:1.25}
.el-lista .nome-a i{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--inchiostro-2);display:block;margin-top:1px}
.el-lista .frecc{color:var(--riga-forte);font-family:var(--mono)}
.el-lista .mie{font-family:var(--mono);font-size:9.5px;color:var(--oliva);border:1px solid rgba(74,93,58,.4);padding:1px 4px;border-radius:2px}

.calendario{display:flex;border:1px solid var(--riga-forte);border-radius:2px;overflow:hidden;margin:4px 0 6px;background:var(--carta-2)}
.cal-m{flex:1 1 0;min-width:0;text-align:center;padding:4px 0 3px;border-right:1px solid var(--riga)}
.cal-m:last-child{border-right:none}
.cal-m span{display:block;font-family:var(--mono);font-size:8.5px;color:var(--inchiostro-2);text-transform:uppercase}
.cal-m i{display:block;height:14px;margin:3px 3px 0;border-radius:1px;background:var(--riga)}
.cal-m[data-l="1"] i{background:rgba(74,93,58,.45)}
.cal-m[data-l="2"] i{background:var(--ocra)}
.cal-m[data-l="3"] i{background:var(--sanguigna)}
.cal-leg{font-family:var(--mono);font-size:9.5px;color:var(--inchiostro-2);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:2px}
.cal-leg b{font-weight:400;display:inline-flex;align-items:center;gap:4px}
.cal-leg em{width:9px;height:9px;border-radius:1px;display:inline-block}

.blocco-sicilia{border:1px solid rgba(74,93,58,.45);background:rgba(74,93,58,.06);border-left:4px solid var(--oliva);
  border-radius:2px;padding:12px 13px;margin-top:22px}
.blocco-sicilia h3{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--oliva);margin:0 0 7px;border:none;padding:0}
.blocco-sicilia .testo{font-size:14.8px}
.blocco-attenzione{border:1px solid rgba(140,29,47,.4);background:rgba(140,29,47,.05);border-left:4px solid var(--sanguigna);
  border-radius:2px;padding:11px 13px;margin-top:14px;font-size:13.8px;line-height:1.5}
.blocco-attenzione b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sanguigna);display:block;margin-bottom:5px}
.fonti-r{font-family:var(--mono);font-size:11px;color:var(--inchiostro-2);line-height:1.7}
.mie-note textarea{width:100%;min-height:110px;padding:10px;background:var(--carta-2);border:1px solid var(--riga-forte);
  border-left:3px solid var(--ocra);border-radius:2px;font-size:15px;line-height:1.55;resize:vertical}

/* ============ HOME A MENU ============ */
.menu-home{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.b-menu{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:17px 15px;
  background:var(--carta-2);border:1px solid var(--riga);border-left:4px solid var(--c,var(--inchiostro));

.b-menu .bm-n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--inchiostro-2);

.b-menu.forte{background:var(--inchiostro);border-color:var(--inchiostro);border-left-color:var(--c)}

  color:var(--inchiostro-2);padding:2px 0 0}

/* ============ RICETTA ============ */
.interr{display:flex;gap:0;border:1px solid var(--riga-forte);border-radius:2px;overflow:hidden;margin-bottom:4px}
.interr button{flex:1;padding:11px 6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;

.base-riga{display:flex;align-items:center;gap:10px;margin-top:9px}

.base-riga select{flex:1;padding:9px 10px;background:var(--carta-2);border:1px solid var(--riga-forte);border-radius:2px;

  background-image:linear-gradient(45deg,transparent 50%,var(--inchiostro-2) 50%),linear-gradient(135deg,var(--inchiostro-2) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 11px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

.prod{border:1px solid var(--riga);background:var(--carta-2);border-radius:2px;padding:10px;margin-bottom:8px;position:relative}

.p-campo{margin:0 0 7px}
.p-campo:last-child{margin-bottom:0}

  color:var(--inchiostro-2);margin-bottom:3px}
.p-campo input,.p-campo select{width:100%;padding:9px 10px;background:var(--carta);border:1px solid var(--riga-forte);
  border-radius:2px;font-size:16px;-webkit-appearance:none;appearance:none}
.p-riga3{display:grid;grid-template-columns:1fr 92px;gap:7px;margin-top:7px}
.p-riga-top{display:grid;grid-template-columns:1fr 104px;gap:7px}
.dose-wrap{position:relative}
.dose-wrap input.dubbia{border:2px solid var(--sanguigna);background:rgba(140,29,47,.07);color:var(--sanguigna);font-weight:600}
.dose-wrap input.certa{border:2px solid var(--oliva);background:rgba(74,93,58,.07)}
.dose-tag{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:9px;
  letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.dose-tag.rosso{color:var(--sanguigna)}
.dose-tag.verde{color:var(--oliva)}
.avviso-dose{background:rgba(140,29,47,.07);border:1px solid rgba(140,29,47,.35);border-left:4px solid var(--sanguigna);
  border-radius:2px;padding:10px 12px;font-size:13.2px;line-height:1.45;color:var(--inchiostro);margin-bottom:10px}
.avviso-dose b{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sanguigna);display:block;margin-bottom:4px}
.barra-az{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.barra-az button{padding:11px 8px;border:1px solid var(--riga-forte);background:var(--carta-2);border-radius:2px;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.barra-az button.primo{background:var(--inchiostro);color:var(--carta);border-color:var(--inchiostro)}
.pillole{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.pillola{background:var(--inchiostro);color:var(--carta);font-size:13px;padding:5px 9px;border-radius:13px;display:inline-flex;align-items:center;gap:7px}
.pillola button{color:rgba(233,234,227,.75);font-size:15px;line-height:1}
.sugg-box{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--carta-2);
  border:1px solid var(--inchiostro);border-top:none;border-radius:0 0 2px 2px;max-height:190px;overflow-y:auto;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.sugg-box[hidden]{display:none}
.sugg-box button{display:block;width:100%;text-align:left;padding:10px 11px;border-bottom:1px solid var(--riga);font-size:15px}
.sugg-box button:last-child{border-bottom:none}

.sugg-box .nuovo{color:var(--oliva);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.rel{position:relative}

/* ============ SUGGERIMENTI DEL MESE ============ */
.card-sug{border:1px solid var(--riga);background:var(--carta-2);border-radius:2px;padding:12px 13px;margin-bottom:8px;
  border-left:4px solid var(--c,var(--ocra))}
.card-sug .cs-h{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.card-sug .cs-n{font-family:var(--serif);font-size:16.5px;line-height:1.2}
.card-sug .cs-liv{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 5px;border-radius:2px;margin-left:auto;flex:0 0 auto}
.card-sug .cs-t{font-size:13.5px;color:var(--inchiostro-2);line-height:1.45}
.card-sug .cs-t b{color:var(--inchiostro);font-weight:600}

.b-genera{width:100%;padding:15px;background:var(--oliva);color:#fff;border-radius:2px;margin:6px 0 18px;

.scelta-vol{display:flex;flex-direction:column;gap:9px;margin:14px 0}

.scelta-vol .sv-t{font-family:var(--serif);font-size:17px;display:block}
.scelta-vol .sv-s{font-size:12.5px;color:var(--inchiostro-2);margin-top:3px;display:block}
.vol-input{display:flex;align-items:center;gap:9px;margin-top:9px}
.vol-input input{flex:1;padding:13px;background:var(--carta);border:2px solid var(--oliva);border-radius:2px;font-size:19px;font-family:var(--mono)}

.tre-az{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.tre-az button{padding:14px;border-radius:2px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--riga-forte);background:var(--carta-2)}
.tre-az button.ok{background:var(--oliva);color:#fff;border-color:var(--oliva)}
.anteprima{border:1px solid var(--riga-forte);background:var(--carta-2);border-radius:2px;padding:14px;margin-top:10px}
.anteprima .ap-h{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--inchiostro-2);
  padding-bottom:7px;border-bottom:1px solid var(--riga);margin-bottom:9px}

.anteprima tr:last-child td{border-bottom:none}
.img-out{width:100%;border:1px solid var(--riga-forte);border-radius:2px;margin-top:12px;display:block}

.prod-riga{border-bottom:1px solid var(--riga);padding-bottom:11px;margin-bottom:5px}
.nota-prod{font-size:12.5px;color:var(--ocra);background:rgba(169,118,27,.07);border-left:3px solid var(--ocra);
  padding:7px 9px;border-radius:2px;margin:2px 0 7px;line-height:1.4}
.b-etichetta{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--sanguigna);border:1px solid rgba(140,29,47,.4);border-radius:2px;padding:6px 10px;text-decoration:none;background:var(--carta-2)}
.b-etichetta:active{background:rgba(140,29,47,.1)}

.imp-sez{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--inchiostro-2);
  margin:24px 0 4px;padding-bottom:5px;border-bottom:1px solid var(--riga)}
.ri-edit{display:flex;gap:8px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--riga)}
.ri-frecce{display:flex;flex-direction:column;gap:3px;flex:0 0 30px;padding-top:4px}
.ri-frecce button{border:1px solid var(--riga-forte);background:var(--carta-2);border-radius:2px;padding:4px 0;
  font-size:9px;color:var(--inchiostro-2);width:30px}
.ri-frecce button:disabled{opacity:.25}
.ri-corpo{flex:1;min-width:0}
.ri-corpo input[type=text]{width:100%;padding:9px 10px;background:var(--carta-2);border:1px solid var(--riga-forte);
  border-radius:2px;font-size:16px;margin-bottom:5px}
.ri-x{flex:0 0 30px;color:var(--sanguigna);font-size:20px;padding:6px 0;line-height:1}

.tinte{display:flex;gap:5px;flex-wrap:wrap;margin:3px 0 2px}
.tinta-b{width:26px;height:26px;border-radius:50%;border:2px solid transparent}
.tinta-b.on{border-color:var(--inchiostro);transform:scale(1.12)}
.scelta.mini-s{font-size:12px;padding:5px 9px}
.cal-tap{cursor:pointer}
.cal-tap i{height:22px}
.cal-m[data-l="0"] i{background:var(--riga)}
/* ============ FLUSSO RICETTA — PASSO DOPO PASSO ============ */
#p-ricetta{background:linear-gradient(180deg,#EFF0E9 0,var(--carta) 300px)}
#p-ricetta .barra-p{background:rgba(239,240,233,.94);border-bottom:1px solid rgba(175,180,166,.5)}

  color:var(--inchiostro-2);text-align:center;line-height:1.3}

.passi{display:flex;gap:6px;margin:13px 0 2px}

.passo-testata{padding:20px 3px 14px}

.blocco{background:var(--carta-2);border:1px solid rgba(175,180,166,.5);border-radius:18px;padding:16px;margin-bottom:12px;

.blocco .bl-t b{display:block;font-family:var(--serif);font-size:18px;font-weight:400;color:var(--inchiostro);
  line-height:1.2;margin-bottom:3px}
#p-ricetta .campo{margin-bottom:0}
#p-ricetta input[type=text],#p-ricetta input[type=date],#p-ricetta input[type=number],
#p-ricetta textarea,#p-ricetta select{border-radius:12px;padding:13px 14px;background:var(--carta);
  border:1px solid rgba(175,180,166,.75)}

#p-ricetta .scelta{border-radius:999px;padding:9px 14px;font-size:14px;background:var(--carta);transition:all .16s ease}
#p-ricetta .scelte{gap:7px}

#p-ricetta .prod{border-radius:14px;padding:14px 12px 12px;background:var(--carta);border-color:rgba(175,180,166,.6)}

#p-ricetta .avviso-dose{border-radius:14px;padding:13px 15px}
#p-ricetta .blocco-attenzione{border-radius:14px}
#p-ricetta .b-genera{border-radius:14px;padding:17px;margin:8px 0 10px}
.avv-scroll{max-height:250px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px}

.pick{position:relative}
.pick-b{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border-radius:12px;text-align:left;
  border:1px dashed rgba(175,180,166,.95);background:var(--carta);color:var(--inchiostro-2);font-size:14.5px;transition:all .16s ease}
.pick-b .pk-i{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:var(--inchiostro);color:var(--carta);font-size:16px;line-height:1}
.pick.ap .pick-b{border-style:solid;border-color:rgba(28,35,33,.7);background:var(--carta-2);color:var(--inchiostro)}

.pick-menu{margin-top:9px;border:1px solid rgba(175,180,166,.75);border-radius:14px;background:var(--carta);
  overflow:hidden;box-shadow:0 16px 34px -26px rgba(28,35,33,.95);animation:apriPick .18s ease}

#p-ricetta .pick-menu input{border:none;border-bottom:1px solid var(--riga);border-radius:0;background:var(--carta-2)}
.pick-lista{max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pk-r{display:block;width:100%;text-align:left;padding:13px 15px;font-size:15px;border-bottom:1px solid rgba(207,210,198,.65)}
.pk-r:last-child{border-bottom:none}
.pk-r:active{background:var(--carta-2)}
#p-ricetta .pillola.rossa{background:var(--sanguigna)}
#p-ricetta .pillola.ocra{background:var(--ocra)}
.dett-tit{border:1px solid rgba(175,180,166,.5);border-radius:16px;background:rgba(243,244,238,.55);padding:0 16px;margin-bottom:12px}
.dett-tit summary{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--inchiostro-2);padding:15px 0;cursor:pointer}

.dett-tit p{margin-bottom:14px}
.pk-r.nuova{background:rgba(74,93,58,.06);border-top:1px solid rgba(207,210,198,.65)}
.pk-r .pk-n{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--oliva);margin-right:9px}
.pk-vuoto{padding:15px;font-size:13px;color:var(--inchiostro-2);line-height:1.45}

.data-riga{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.data-testo{font-family:var(--serif);font-size:16.5px}
.pk-oggi{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:6px 12px;border-radius:999px;border:1px solid var(--riga-forte);color:var(--inchiostro-2);background:var(--carta)}

.b-avanti{width:100%;padding:17px;border-radius:14px;background:var(--inchiostro);color:var(--carta);font-size:15px;
  margin:8px 0 12px;box-shadow:0 12px 26px -16px rgba(28,35,33,.95);transition:transform .1s}

.b-salva-g{width:100%;padding:17px;border-radius:14px;background:var(--sanguigna);color:#fff;font-size:15px;

.pie-nav{display:flex;gap:8px;margin:2px 0 8px}
.pie-nav button{flex:1;padding:14px 10px;border-radius:12px;border:1px solid rgba(175,180,166,.65);

/* ============ MORBIDEZZA GENERALE ============ */
