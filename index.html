let IMP={vista:"menu",arg:null};

function impBarra(t,indietro){
  return '<div class="barra-p"><button class="indietro" data-imp-back="'+(indietro||"menu")+'">\u2039 '+
    (indietro==="chiudi"?"Chiudi":"Indietro")+'</button><span class="titolo-p">'+esc(t)+'</span><span style="width:60px"></span></div>';
}
function rigaEdit(i,val,extra,n){
  return '<div class="ri-edit" data-i="'+i+'">'+
    '<div class="ri-frecce"><button data-su="'+i+'" '+(i===0?"disabled":"")+'>\u25b2</button>'+
    '<button data-giu="'+i+'" '+(i===n-1?"disabled":"")+'>\u25bc</button></div>'+
    '<div class="ri-corpo">'+val+(extra||"")+'</div>'+
    '<button class="ri-x" data-del="'+i+'">\u00d7</button></div>';
}
function inp(campo,i,v,ph,cls){
  return '<input type="text" data-campo="'+campo+'" data-i="'+i+'" value="'+esc(v||"")+'" placeholder="'+esc(ph||"")+'" class="'+(cls||"")+'">';
}
function impSalva(){salva();}

/* ---------- router ---------- */
function apriImp(vista,arg){
  IMP={vista:vista||"menu",arg:arg===undefined?null:arg};
  const p=$("#p-impostazioni");
  p.innerHTML=impCorpo();
  mostraPannello(p);
  p.scrollTop=0;
}
function impVoce(k,t,s,n){
  return '<button class="voce-imp" data-imp="'+k+'"><span><span class="vi-t">'+t+'</span><span class="vi-s">'+s+'</span></span>'+
    (n!==undefined?'<span class="bm-n">'+n+'</span>':'<span class="frecc">\u203a</span>')+'</button>';
}
function impCorpo(){
  const v=IMP.vista;
  if(v==="menu")return impMenu();
  if(v==="home")return impHome();
  if(v==="colture-home")return impColtureHome();
  if(v==="colture")return impColture();
  if(v==="fasi")return impFasi();
  if(v==="avversita")return impAvversita();
  if(v==="prodotti")return impProdotti();

function formulatoDaNome(nome){
  const n=norm(nome);
  for(let i=0;i<RICONOSCI.length;i++)
    if(RICONOSCI[i][0].some(k=>n.indexOf(norm(k))>=0))return RICONOSCI[i][1];
  return "";
}
function pesoFormulato(f){
  if(!f) return 6.5;
  const o=ORDINE_MISCELA().find(x=>x.f.some(y=>y.toLowerCase()===String(f).toLowerCase()));
  return o?o.g:6.5;
}

    aziendeDi(v).join(" "),(v.avversita||[]).map(avvNome).join(" "),nomiColture(v),varietaDi(v).join(" "),

function filtra(extra){
  const q=S.q.trim().toLowerCase(),parole=q?q.split(/\s+/):[];
  return DB.voci.filter(function(v){
    if(S.coltura&&coltureDi(v).indexOf(S.coltura)<0) return false;
    if(extra&&!extra(v)) return false;
    if(S.mese!==null&&meseDi(v)!==S.mese) return false;
    if(S.avversita.length&&!S.avversita.every(a=>(v.avversita||[]).indexOf(a)>=0)) return false;
    if(S.fasi.length&&S.fasi.indexOf(v.fase)<0) return false;
    if(parole.length){const t=testoIndicizzato(v);if(!parole.every(p=>t.indexOf(p)>=0)) return false;}
    return true;
  }).sort(function(a,b){
    if(!!a.pin!==!!b.pin) return a.pin?-1:1;
    return (b.data||"").localeCompare(a.data||"")||(b.creato||0)-(a.creato||0);
  });

/* ============================================================
   7bis. CONVERSIONE DOSI
   ============================================================ */
function numDose(x){
  const n=parseFloat(String(x).replace(",","."));
  return isNaN(n)?null:n;
}
// normalizza: sotto 1 kg/L -> g/mL ; sopra 999 g/mL -> kg/L
function normalizzaDose(val,unita){
  let v=val,u=unita;
  if(u==="L"&&v<1){v=v*1000;u="ml";}
  else if(u==="kg"&&v<1){v=v*1000;u="g";}
  else if(u==="ml"&&v>999){v=v/1000;u="L";}
  else if(u==="g"&&v>999){v=v/1000;u="kg";}
  return {val:v,unita:u};
}
function fmtNum(n){
  if(n===null||isNaN(n))return "";
  let s=(Math.round(n*1000)/1000).toString();
  return s.replace(".",",");
}
function convertiProdotto(p,fattore){
  const n=numDose(p.dose);
  if(n===null) return {nome:p.nome,formulato:p.formulato,dose:p.dose,unita:p.unita,nc:true};
  if(p.unita==="%") return {nome:p.nome,formulato:p.formulato,dose:p.dose,unita:p.unita,nc:true};
  const r=normalizzaDose(n*fattore,p.unita||"");
  return {nome:p.nome,formulato:p.formulato,dose:fmtNum(r.val),unita:r.unita};
}
function convertiRicetta(v,litriNuovi){
  const baseN=numDose(v.base);
  if(!baseN||!litriNuovi) return null;
  const f=litriNuovi/baseN;
  return (v.prodotti||[]).filter(p=>p.nome).map(p=>convertiProdotto(p,f));
}

/* ============================================================
   7ter. METEO — luoghi salvati e temperature del giorno
   Fonte automatica: Open-Meteo (api.open-meteo.com), API pubblica
   senza chiave e con CORS aperto, dati CC BY 4.0. Sono previsioni
   di modello sulle coordinate indicate, NON misure di una stazione
   a terra: SIAS e 3bmeteo restano il riscontro da fare a mano.
   Ogni valore scritto a mano vince e non viene piu' sovrascritto
   (m.fonte === "manuale").
   ============================================================ */
const METEO_URL="https://api.open-meteo.com/v1/forecast";
const METEO_GEO="https://geocoding-api.open-meteo.com/v1/search";
const METEO_SIAS="http://www.sias.regione.sicilia.it/frameset_previsioni.htm";
const METEO_3B="https://www.3bmeteo.com/meteo/";
const METEO_VAR_PIENE="temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,relative_humidity_2m_mean";
const METEO_VAR_BASE="temperature_2m_max,temperature_2m_min,precipitation_sum";
const METEO_CAMPI=["tmax","tmin","pioggia","vento","umid"];
const DEF_LUOGHI=[
  {id:"paterno",nome:"Patern\u00f2",lat:37.5667,lon:14.9,def:true,slug:"paterno"},
  {id:"catania",nome:"Catania",lat:37.5079,lon:15.083,def:true,slug:"catania"}
];
let METEO_STATO={q:"",ris:[],msg:"",mod:null,lav:false};
let METEO_RITORNO=null;

function meteoCfg(){
  const c=cfg();
  if(!c.meteo)c.meteo={};
  if(!Array.isArray(c.meteo.luoghi))c.meteo.luoghi=DEF_LUOGHI.map(function(l){return Object.assign({},l);});
  if(c.meteo.auto===undefined)c.meteo.auto=true;
  return c.meteo;
}
function luoghiMeteo(){return meteoCfg().luoghi;}
function luogoMeteo(id){return luoghiMeteo().find(function(l){return l.id===id;})||null;}
function luoghiDefault(){
  const l=luoghiMeteo().filter(function(x){return x.def!==false;});
  return l.length?l:luoghiMeteo().slice(0,1);
}
function cacheMeteo(){DB.cacheMeteo=DB.cacheMeteo||{};return DB.cacheMeteo;}
function metNum(x){
  if(x===null||x===undefined||x==="")return "";
  const n=Number(x);
  return isNaN(n)?"":n;
}
function fmtT(x){
  if(x===null||x===undefined||x==="")return "";
  const n=Number(x);
  if(isNaN(n))return String(x);
  return String(Math.round(n*10)/10).replace(".",",");
}
function slugLuogo(n){
  return String(n||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
function nuovoIdLuogo(nome){
  let b=slugLuogo(nome)||("luogo-"+Date.now().toString(36));
  let k=b,i=2;
  while(luoghiMeteo().some(function(l){return l.id===k;})){k=b+"-"+i;i++;}
  return k;
}

/* ---------- scarico dei dati ---------- */
function chiediMeteo(l,forza){
  if(!l||l.lat===undefined||l.lon===undefined||l.lat===""||l.lon==="")
    return Promise.reject(new Error("coordinate mancanti"));
  const c=cacheMeteo(),vecchia=c[l.id];
  const buona=vecchia&&vecchia.giorni&&Number(vecchia.lat)===Number(l.lat)&&
    Number(vecchia.lon)===Number(l.lon)&&(Date.now()-vecchia.t)<3*3600*1000;
  if(buona&&!forza)return Promise.resolve(vecchia.giorni);
  if(typeof navigator!=="undefined"&&navigator.onLine===false)
    return Promise.reject(new Error("nessuna connessione"));
  function tenta(vars){
    const u=METEO_URL+"?latitude="+encodeURIComponent(l.lat)+"&longitude="+encodeURIComponent(l.lon)+
      "&daily="+vars+"&timezone=Europe%2FRome&past_days=7&forecast_days=16";
    return fetch(u).then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);
      return r.json();
    }).then(function(j){
      if(!j||!j.daily||!j.daily.time)throw new Error("risposta senza dati");
      return j;
    });
  }
  return tenta(METEO_VAR_PIENE).catch(function(){return tenta(METEO_VAR_BASE);}).then(function(j){
    const d=j.daily,g={};
    d.time.forEach(function(gg,i){
      g[gg]={
        tmax:metNum(d.temperature_2m_max&&d.temperature_2m_max[i]),
        tmin:metNum(d.temperature_2m_min&&d.temperature_2m_min[i]),
        pioggia:metNum(d.precipitation_sum&&d.precipitation_sum[i]),
        vento:metNum(d.wind_speed_10m_max&&d.wind_speed_10m_max[i]),
        umid:metNum(d.relative_humidity_2m_mean&&d.relative_humidity_2m_mean[i])
      };
    });
    c[l.id]={t:Date.now(),lat:Number(l.lat),lon:Number(l.lon),nome:l.nome,giorni:g};
    salva();
    return g;
  });
}
function cercaLuogo(q){
  const u=METEO_GEO+"?name="+encodeURIComponent(q)+"&count=8&language=it&format=json";
  return fetch(u).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){return (j&&j.results)?j.results:[];});
}

/* ---------- righe meteo dentro la ricetta ---------- */
function rigaMeteoDa(l){
  return {luogoId:l.id,nome:l.nome,lat:l.lat,lon:l.lon,
    tmax:"",tmin:"",pioggia:"",vento:"",umid:"",fonte:"",gg:""};
}
function meteoVuoto(){
  if(!meteoCfg().auto)return [];
  return luoghiDefault().map(rigaMeteoDa);
}
function meteoPieno(m){
  return METEO_CAMPI.some(function(k){return m[k]!==""&&m[k]!==undefined&&m[k]!==null;});
}
function meteoRiassunto(v){
  return (v.meteo||[]).filter(meteoPieno).map(function(m){
    const t=[];
    if(m.tmax!=="")t.push(fmtT(m.tmax)+"\u00b0");
    if(m.tmin!=="")t.push(fmtT(m.tmin)+"\u00b0");
    return m.nome+" "+(t.length?t.join(" / "):"\u2014");
  }).join("  \u00b7  ");
}
function compilaMeteoRicetta(forza){
  if(!R||!Array.isArray(R.meteo)||!R.meteo.length)return;
  if(!meteoCfg().auto&&!forza)return;
  const data=R.data||oggiISO(),idRic=R.id;
  R.meteo.forEach(function(m,i){
    if(m.fonte==="manuale"&&!forza)return;
    const l=luogoMeteo(m.luogoId)||{id:m.luogoId||("tmp-"+i),nome:m.nome,lat:m.lat,lon:m.lon};
    chiediMeteo(l,!!forza).then(function(g){
      if(!R||R.id!==idRic)return;
      const m2=R.meteo[i];
      if(!m2||(m2.fonte==="manuale"&&!forza))return;
      const v=g[data];
      if(!v){m2.fonte="fuori";m2.gg=data;aggiornaCampiMeteo();return;}
      METEO_CAMPI.forEach(function(k){m2[k]=fmtT(v[k]);});
      m2.fonte="auto";m2.gg=data;
      aggiornaCampiMeteo();
    }).catch(function(){
      if(!R||R.id!==idRic)return;
      const m2=R.meteo[i];
      if(m2&&m2.fonte!=="manuale"&&!meteoPieno(m2)){m2.fonte="niente";aggiornaCampiMeteo();}
    });
  });
}
function aggiornaCampiMeteo(){
  const box=$("#r-meteo");if(!box||!R||!R.meteo)return;
  R.meteo.forEach(function(m,i){
    METEO_CAMPI.forEach(function(k){
      const el=box.querySelector('[data-met="'+k+'"][data-i="'+i+'"]');
      if(el&&document.activeElement!==el)el.value=(m[k]===undefined||m[k]===null)?"":m[k];
    });
    const f=box.querySelector('[data-met-fonte="'+i+'"]');
    if(f)f.innerHTML=meteoFonteHTML(m);
  });
}
function meteoFonteHTML(m){
  if(m.fonte==="manuale")return '<span class="met-pill man">scritto a mano</span>';
  if(m.fonte==="auto")return '<span class="met-pill auto">Open-Meteo</span><span>'+esc(dataIt(m.gg||""))+'</span>';
  if(m.fonte==="fuori")return '<span class="met-pill">fuori previsione</span><span>oltre 16 giorni avanti o 7 indietro: scrivi a mano</span>';
  if(m.fonte==="niente")return '<span class="met-pill">non scaricato</span><span>senza rete: scrivi a mano</span>';
  return '<span class="met-pill">in attesa\u2026</span>';
}
function bloccoMeteo(){
  const l=luoghiMeteo(),righe=R.meteo||[];
  const corpo=righe.map(function(m,i){
    let opt=l.map(function(x){
      return '<option value="'+esc(x.id)+'"'+(x.id===m.luogoId?" selected":"")+'>'+esc(x.nome)+'</option>';
    }).join("");
    if(!l.some(function(x){return x.id===m.luogoId;}))
      opt='<option value="'+esc(m.luogoId||"")+'" selected>'+esc(m.nome||"\u2014")+'</option>'+opt;
    return '<div class="met-riga" data-i="'+i+'">'+
      '<div class="met-top"><select data-met-luogo="'+i+'">'+opt+'</select>'+
      '<button class="met-x" data-met-agg="'+i+'" title="Riscarica questo luogo">\u21bb</button>'+
      '<button class="met-x" data-met-del="'+i+'" aria-label="Togli">\u00d7</button></div>'+
      '<div class="met-campi">'+
        '<div class="met-c"><label>T max \u00b0C</label><input type="text" inputmode="decimal" data-met="tmax" data-i="'+i+'" value="'+esc(m.tmax||"")+'" placeholder="\u2014"></div>'+
        '<div class="met-c"><label>T min \u00b0C</label><input type="text" inputmode="decimal" data-met="tmin" data-i="'+i+'" value="'+esc(m.tmin||"")+'" placeholder="\u2014"></div>'+
        '<div class="met-c"><label>Pioggia mm</label><input type="text" inputmode="decimal" data-met="pioggia" data-i="'+i+'" value="'+esc(m.pioggia||"")+'" placeholder="\u2014"></div>'+
        '<div class="met-c"><label>Vento max km/h</label><input type="text" inputmode="decimal" data-met="vento" data-i="'+i+'" value="'+esc(m.vento||"")+'" placeholder="\u2014"></div>'+
        '<div class="met-c"><label>Umidit\u00e0 media %</label><input type="text" inputmode="decimal" data-met="umid" data-i="'+i+'" value="'+esc(m.umid||"")+'" placeholder="\u2014"></div>'+
      '</div>'+
      '<div class="met-fonte" data-met-fonte="'+i+'">'+meteoFonteHTML(m)+'</div></div>';
  }).join("");
  const liberi=l.filter(function(x){return !righe.some(function(m){return m.luogoId===x.id;});});
  return '<div class="blocco"><span class="bl-t"><b>Meteo</b>Massima e minima del giorno indicato sopra, riempite da sole per i luoghi predefiniti. '+
    'Ogni casella resta modificabile: se la tocchi, il valore diventa tuo e non viene pi\u00f9 sovrascritto.</span>'+
    '<div id="r-meteo">'+(corpo||'<p class="suggerimento" style="margin:0 0 10px">Nessun luogo in questa ricetta.</p>')+'</div>'+
    (liberi.length?'<div class="met-az">'+liberi.map(function(x){
      return '<button class="mini" data-met-add="'+esc(x.id)+'">+ '+esc(x.nome)+'</button>';
    }).join("")+'</div>':"")+
    '<div class="met-az"><button class="mini" data-met-tutti>\u21bb Riscarica tutto</button>'+
    '<button class="mini" data-met-pagina>Gestisci i luoghi \u203a</button></div></div>';
}

/* ---------- pagina Meteo ---------- */
function apriMeteo(ritorno){
  METEO_RITORNO=ritorno||null;
  METEO_STATO.ris=[];METEO_STATO.msg="";METEO_STATO.mod=null;
  disegnaMeteo();
  mostraPannello($("#p-meteo"));
}
function prevLuogo(l){
  const c=cacheMeteo()[l.id];
  if(!c||!c.giorni)return '<p class="suggerimento" style="margin:9px 0 0">Nessuna previsione ancora scaricata per questo luogo.</p>';
  const oggi=oggiISO();
  const gg=Object.keys(c.giorni).filter(function(x){return x>=oggi;}).sort().slice(0,4);

let R=null,PASSO=1,PICK=null,RES=false,RIC_TOP=false;
function nuovoProdotto(){return {nome:"",formulato:"",dose:"",unita:"",ok:true,auto:false};}
function prodottoNoto(nome){return (DB.prodotti||[]).find(p=>norm(p.nome)===norm(nome));}
function ricettaVuota(modo){
  const colDef=S.coltura||(DB.colture[0]||{}).id||"";
  return {id:nuovoId(),tipo:"Ricetta",modo:modo,base:(basiDi(modo)[0]||{}).v,data:oggiISO(),
    coltura:colDef,colture:[colDef],varieta:[],aziende:[],avversita:[],fase:"",tag:[],titolo:"",
    prodotti:[nuovoProdotto()],testo:"",allegati:[],meteo:meteoVuoto(),
    pin:false,creato:Date.now(),modificato:Date.now()};
}
function apriRicetta(modo,id){
  R=id?JSON.parse(JSON.stringify(DB.voci.find(v=>v.id===id))):ricettaVuota(modo);
  if(!R.prodotti||!R.prodotti.length) R.prodotti=[nuovoProdotto()];
  R.prodotti.forEach(function(p){if(p.ok===undefined)p.ok=true;});
  if(!R.aziende) R.aziende=aziendeDi(R);
  R.colture=coltureDi(R);if(!R.colture.length)R.colture=[S.coltura];
  R.varieta=varietaDi(R);
  if(!R.modo) R.modo=modo||"fogliare";
  if(!R.base) R.base=(basiDi(R.modo)[0]||{}).v;
  if(!Array.isArray(R.meteo))R.meteo=id?[]:meteoVuoto();
  RES=!!id;PASSO=1;PICK=null;RIC_TOP=true;
  disegnaRicetta();
  mostraPannello($("#p-ricetta"));
  compilaMeteoRicetta(false);
}
function vaiPasso(n){
  leggiRicetta();
  if(PICK&&liberoPick(PICK)){
    const i=$("#r-"+PICK),v=i?i.value.trim():"";
    if(v)aggiungiScelta(PICK,v);
  }
  PASSO=n;PICK=null;RIC_TOP=true;disegnaRicetta();
}

  ara:["Tarocco","Tarocco Ippolito","Tarocco Sciara","Tarocco Gallo","Tarocco Meli","Moro","Sanguinello",
       "Washington Navel","Navelina","Newhall","Lane Late","Valencia Late","Ovale","Vaniglia"],

};
const GIORNI_L=["domenica","luned\u00ec","marted\u00ec","mercoled\u00ec","gioved\u00ec","venerd\u00ec","sabato"];
function dataEstesa(iso){
  const p=String(iso||"").split("-");
  if(p.length!==3)return "\u2014";
  const d=new Date(+p[0],+p[1]-1,+p[2]);
  if(isNaN(d.getTime()))return dataIt(iso);
  return GIORNI_L[d.getDay()]+" "+(+p[2])+" "+MESI_LUNGHI[+p[1]-1].toLowerCase()+" "+p[0];
}
function elencoVarieta(){
  const t=[];
  const add=function(x){if(x&&!t.some(y=>norm(y)===norm(x)))t.push(x);};
  R.colture.forEach(function(id){(DEF_VARIETA[id]||[]).forEach(add);});
  DB.voci.forEach(function(v){varietaDi(v).forEach(add);});
  return t;
}
function elencoAziende(){return (DB.aziende||[]).slice().sort((a,b)=>String(a).localeCompare(String(b),"it"));}
function fasiRicetta(){
  const f=[];
  R.colture.forEach(function(id){const x=coltura(id);if(x)x.fasi.forEach(function(y){if(f.indexOf(y)<0)f.push(y);});});
  return f;
}
function avvRicetta(){return DB.avversita.filter(a=>!a.colture.length||a.colture.some(x=>R.colture.indexOf(x)>=0));}

/* ---------- selettori a scomparsa ---------- */
function liberoPick(k){return k==="var"||k==="az";}
function elencoPick(k){
  if(k==="var")return elencoVarieta().map(x=>({v:x,t:x}));
  if(k==="az")return elencoAziende().map(x=>({v:x,t:x}));
  if(k==="fase")return fasiRicetta().map(x=>({v:x,t:x}));
  return avvRicetta().map(a=>({v:a.id,t:a.nome}));
}
function giaPick(k){
  if(k==="var")return R.varieta;
  if(k==="az")return R.aziende;
  if(k==="fase")return R.fase?[R.fase]:[];
  return R.avversita;
}
function nomePick(k,v){
  if(k!=="avv")return v;
  const a=DB.avversita.find(x=>x.id===v);
  return a?a.nome:v;
}
function aggiungiScelta(k,v){
  if(k==="var"){if(!R.varieta.some(x=>norm(x)===norm(v)))R.varieta.push(v);}
  else if(k==="az"){if(!R.aziende.some(x=>norm(x)===norm(v)))R.aziende.push(v);}
  else if(k==="fase"){R.fase=v;PICK=null;}
  else if(k==="avv"){if(R.avversita.indexOf(v)<0)R.avversita.push(v);}
}
function togliScelta(k,i){
  if(k==="var")R.varieta.splice(i,1);
  else if(k==="az")R.aziende.splice(i,1);
  else if(k==="fase")R.fase="";
  else R.avversita.splice(i,1);
}
function righePick(k,q){
  const el=elencoPick(k),gia=giaPick(k);
  const l=el.filter(x=>!gia.some(g=>norm(g)===norm(x.v))&&(!q||norm(x.t).indexOf(norm(q))>=0));
  const nuovo=liberoPick(k)&&q&&!el.some(x=>norm(x.t)===norm(q))&&!gia.some(g=>norm(g)===norm(q));
  const righe=l.map(x=>'<button class="pk-r" data-scegli="'+k+'" data-val="'+esc(x.v)+'">'+esc(x.t)+'</button>').join("")+
    (nuovo?'<button class="pk-r nuova" data-scegli="'+k+'" data-val="'+esc(q)+'"><span class="pk-n">aggiungi</span>'+esc(q)+'</button>':"");
  return righe||'<div class="pk-vuoto">'+(liberoPick(k)?
    "Nessun nome corrisponde. Scrivilo qui sopra e tocca \u00abaggiungi\u00bb.":
    "Nessuna voce corrisponde. Le voci si aggiungono da Impostazioni.")+'</div>';
}
function pickerHTML(k,etichetta){
  const ap=PICK===k;
  return '<div class="pick'+(ap?" ap":"")+'">'+
    '<button class="pick-b" data-pick-apri="'+k+'"><span class="pk-i">'+(ap?"\u00d7":"+")+'</span>'+esc(ap?"Chiudi l\u2019elenco":etichetta)+'</button>'+
    (ap?'<div class="pick-menu">'+
      '<input type="text" id="r-'+k+'" placeholder="'+(liberoPick(k)?"Scrivi, oppure scegli qui sotto":"Filtra l\u2019elenco")+'" autocomplete="off">'+
      '<div class="pick-lista" data-lista="'+k+'">'+righePick(k,"")+'</div>'+
    '</div>':"")+'</div>';
}
function pilloleScelte(k){
  const gia=giaPick(k);
  if(!gia.length)return "";
  return '<div class="pillole">'+gia.map((x,i)=>'<span class="pillola'+(k==="avv"?" rossa":(k==="fase"?" ocra":""))+'">'+esc(nomePick(k,x))+
    '<button data-tog-pick="'+k+'" data-i="'+i+'" aria-label="Togli">\u00d7</button></span>').join("")+'</div>';
}

function creaImmagine(){
  const vol=modoVol(R.modo);
  const conv=(G.scelta==="conv"&&G.litri)?convertiRicetta(R,G.litri):R.prodotti.filter(p=>p.nome);
  const et=(G.scelta==="conv"&&G.litri)?("per "+fmtNum(G.litri)+" litri"):((vol?"per ":"a ")+baseEtichetta());
  const W=1080,P=64;
  const note=(R.testo||"").split("\n");
  const cv=document.createElement("canvas");
  const ctx=cv.getContext("2d");
  // misura altezza
  function wrap(txt,maxW,font){
    ctx.font=font;const par=String(txt).split(" ");const out=[];let l="";
    par.forEach(function(w){const t=l?l+" "+w:w;if(ctx.measureText(t).width>maxW&&l){out.push(l);l=w;}else l=t;});
    if(l)out.push(l);return out;
  }
  let righeNote=[];
  note.forEach(function(n){ if(n.trim()) righeNote=righeNote.concat(wrap(n,W-2*P,"30px Georgia, serif")); else righeNote.push(""); });
  const metLinea=meteoRiassunto(R);
  const H=300+conv.length*76+(righeNote.length?70+righeNote.length*42:0)+120+(metLinea?42:0);
  cv.width=W;cv.height=H;
  const c=cv.getContext("2d");
  c.fillStyle="#E9EAE3";c.fillRect(0,0,W,H);
  const tinta=coloreColtura(R.colture[0]);
  c.fillStyle=tinta;c.fillRect(0,0,W,14);
  let y=90;
  c.fillStyle="#5D6660";c.font="600 24px ui-monospace, Menlo, monospace";
  c.fillText(MODO(R.modo).toUpperCase()+"  \u00b7  "+dataIt(R.data),P,y);
  y+=58;
  c.fillStyle="#1C2321";c.font="48px Georgia, serif";
  wrap(titoloRicetta(),W-2*P,"48px Georgia, serif").slice(0,2).forEach(function(l){c.fillText(l,P,y);y+=56;});
  y+=6;
  c.fillStyle="#5D6660";c.font="27px -apple-system, Arial, sans-serif";
  let sub=R.colture.map(nomeColtura).join(" \u00b7 ")+(R.varieta.length?" \u2014 "+R.varieta.join(", "):"");
  if(R.aziende.length)sub+="  \u00b7  "+R.aziende.join(", ");
  c.fillText(sub,P,y);y+=46;
  if(metLinea){
    c.fillStyle="#5D6660";c.font="24px ui-monospace, Menlo, monospace";
    c.fillText(wrap(metLinea,W-2*P,"24px ui-monospace, Menlo, monospace")[0],P,y);y+=42;
  }
  // banda dose
  c.fillStyle=tinta;c.fillRect(P,y-4,W-2*P,62);
  c.fillStyle="#fff";c.font="600 30px ui-monospace, Menlo, monospace";
  c.fillText("DOSE "+et.toUpperCase(),P+22,y+36);
  y+=104;
  // prodotti
  conv.forEach(function(p,i){
    if(i%2===0){c.fillStyle="#F3F4EE";c.fillRect(P,y-40,W-2*P,72);}
    c.fillStyle="#1C2321";c.font="34px Georgia, serif";
    let nome=p.nome+(p.formulato?"  ("+p.formulato+")":"");
    c.fillText(wrap(nome,W-2*P-300,"34px Georgia, serif")[0],P+18,y);
    c.font="600 36px ui-monospace, Menlo, monospace";
    const d=(p.dose||"")+" "+(p.unita||"");
    c.textAlign="right";c.fillText(d,W-P-18,y);c.textAlign="left";
    y+=76;
  });
  if(righeNote.length){
    y+=26;c.strokeStyle="#CFD2C6";c.lineWidth=2;
    c.beginPath();c.moveTo(P,y-30);c.lineTo(W-P,y-30);c.stroke();
    c.fillStyle="#5D6660";c.font="600 22px ui-monospace, Menlo, monospace";
    c.fillText("NOTE",P,y+6);y+=48;
    c.fillStyle="#1C2321";c.font="30px Georgia, serif";
    righeNote.forEach(function(l){c.fillText(l,P,y);y+=42;});
  }
  c.fillStyle="#AFB4A6";c.font="22px ui-monospace, Menlo, monospace";
  c.fillText("Quaderno \u00b7 verificare sempre l\u2019etichetta e il disciplinare in vigore",P,H-40);
  return cv;
}

function registraProdotti(v){
  DB.prodotti=DB.prodotti||[];DB.aziende=DB.aziende||[];
  (v.prodotti||[]).forEach(function(p){
    if(!p.nome)return;
    const e=prodottoNoto(p.nome);
    if(!p.formulato){const f=formulatoDaNome(p.nome);if(f)p.formulato=f;}
    if(e){
      if(p.formulato)e.formulato=p.formulato;
      if(p.dose){e.dose=p.dose;e.unita=p.unita||e.unita;}
      if(p.unita&&!e.unita)e.unita=p.unita;
      e.usi=(e.usi||1)+1;
    }
    else DB.prodotti.push({nome:p.nome,formulato:p.formulato||"",dose:p.dose||"",unita:p.unita||"",usi:1});
  });
  aziendeDi(v).forEach(function(a){if(a&&!DB.aziende.some(x=>norm(x)===norm(a)))DB.aziende.push(a);});
}

function mostraPannello(p){$$(".pannello").forEach(function(x){if(x!==p)x.hidden=true;});p.hidden=false;p.scrollTop=0;document.body.style.overflow="hidden";}
function chiudiPannelli(){$$(".pannello").forEach(function(x){x.hidden=true;});document.body.style.overflow="";}
function vaiA(k){
  chiudiPannelli();
  if(k.indexOf("ric-")===0){apriRicetta(k.slice(4));return;}
  if(k==="meteo"){apriMeteo(null);return;}
  let vis=k;
  if(k==="mese")vis="storico";
  sezione=vis;
  aggiornaTabBasso(vis);
  ["home","storico","suggerimenti","consultorio","prodotti"].forEach(function(x){
    const el=$("#sez-"+x);if(el)el.hidden=(x!==vis);
  });
  $("#conta").hidden=(vis!=="storico");
  $("#h-titolo").innerHTML=(vis==="home")?'Quaderno<em>.</em>':'<button data-home style="font-family:var(--serif);font-size:22px">\u2039 Quaderno</button>';
  if(k==="storico"){filtroStorico=null;S.mese=null;disegnaNastro();disegnaFiltriStorico();disegnaLista(null);}
  else if(k==="mese"){
    const m=new Date().getMonth(),a=new Date().getFullYear();
    S.mese=m;filtroStorico=function(v){return annoDi(v)===a;};
    disegnaNastro();disegnaFiltriStorico();disegnaLista(filtroStorico);
  }
  else if(k==="suggerimenti")disegnaSuggerimenti();
  else if(k==="consultorio"){SC.liv="colture";SC.coltura=S.coltura;SC.q="";disegnaConsultorio();}
  else if(k==="prodotti")disegnaProdotti();
  else if(k==="home")disegnaHome();
  window.scrollTo(0,0);
}

function mostraSugg(box,voci,onPick,testo){
  if(!box)return;
  const nuovo=testo&&!voci.some(v=>norm(v)===norm(testo));
  if(!voci.length&&!nuovo){box.hidden=true;return;}
  box.innerHTML=voci.map((v,i)=>'<button data-pick="'+i+'">'+esc(v)+'</button>').join("")+
    (nuovo?'<button data-pick="new"><span class="nuovo">nuovo \u00b7</span> '+esc(testo)+'</button>':"");
  box.hidden=false;
  box.onclick=function(e){
    const b=e.target.closest("[data-pick]");if(!b)return;
    e.preventDefault();e.stopPropagation();
    onPick(b.dataset.pick==="new"?testo:voci[+b.dataset.pick]);
    box.hidden=true;
  };
}

function confermaDose(el){
  const prod=R.prodotti[+el.dataset.i];
  if(!prod||!prod.dose||prod.ok)return;
  prod.ok=true;prod.auto=false;
  el.classList.remove("dubbia");el.classList.add("certa");
  const tag=el.parentElement.querySelector(".dose-tag");
  if(tag){tag.className="dose-tag verde";tag.textContent="\u2713";}
  const av=$("#p-ricetta .avviso-dose");
  if(av){
    const rest=R.prodotti.filter(x=>x.nome&&x.dose&&!x.ok).length;
    if(!rest)av.remove();else av.querySelector("b").textContent=rest+" dose da confermare";
  }
}
$("#p-ricetta").addEventListener("click",function(e){
  const t=e.target;
  if(t.closest("[data-annulla]")){if(confirm("Chiudere senza salvare?")){chiudiPannelli();vaiA("home");}return;}
  if(t.closest("[data-salva]")){
    leggiRicetta();
    const usati=R.prodotti.filter(p=>p.nome);
    if(!usati.length){avviso("Aggiungi almeno un prodotto");vaiPasso(1);return;}
    const rossi=usati.filter(p=>p.dose&&!p.ok);
    if(rossi.length){avviso("Conferma le dosi in rosso");vaiPasso(1);return;}
    R.prodotti=usati;R.titolo=titoloRicetta();R.modificato=Date.now();R.coltura=R.colture[0];
    registraProdotti(R);
    const i=DB.voci.findIndex(v=>v.id===R.id);
    if(i>=0)DB.voci[i]=R;else DB.voci.unshift(R);
    salva();chiudiPannelli();vaiA("home");avviso("Ricetta salvata");
    return;
  }
  const md=t.closest("[data-modo]");
  if(md){leggiRicetta();R.modo=md.dataset.modo;R.base=(basiDi(R.modo)[0]||{}).v;disegnaRicetta(false);return;}
  const ct=t.closest("[data-colt]");
  if(ct){leggiRicetta();const id=ct.dataset.colt;
    const k=R.colture.indexOf(id);
    if(k>=0){if(R.colture.length===1){avviso("Serve almeno una coltura");return;}R.colture.splice(k,1);}
    else R.colture.push(id);
    R.coltura=R.colture[0];disegnaRicetta(false);return;}
  const tp=t.closest("[data-tog-pick]");
  if(tp){leggiRicetta();togliScelta(tp.dataset.togPick,+tp.dataset.i);disegnaRicetta();return;}
  const ps=t.closest("[data-passo]");
  if(ps){vaiPasso(+ps.dataset.passo);return;}
  const pa=t.closest("[data-pick-apri]");
  if(pa){leggiRicetta();const k=pa.dataset.pickApri;PICK=(PICK===k?null:k);disegnaRicetta();
    if(PICK)setTimeout(function(){const i=$("#r-"+PICK);if(i)i.focus();},70);return;}
  const sg=t.closest("[data-scegli]");
  if(sg){leggiRicetta();const k=sg.dataset.scegli;
    aggiungiScelta(k,sg.dataset.val);
    disegnaRicetta();
    if(PICK===k)setTimeout(function(){const i=$("#r-"+k);if(i)i.focus();},70);
    return;}
  if(t.closest("[data-oggi]")){leggiRicetta();R.data=oggiISO();disegnaRicetta();avviso("Data riportata a oggi");return;}
  if(t.closest("[data-add-prod]")){leggiRicetta();R.prodotti.push(nuovoProdotto());disegnaRicetta(false);
    setTimeout(function(){const el=$("#r-prod .prod:last-child input");if(el)el.focus();},80);return;}
  const dp=t.closest("[data-del-prod]");
  if(dp){leggiRicetta();R.prodotti.splice(+dp.dataset.delProd,1);if(!R.prodotti.length)R.prodotti=[nuovoProdotto()];disegnaRicetta(false);return;}
  if(t.closest("[data-ordina]")){
    leggiRicetta();
    const pieni=R.prodotti.filter(p=>p.nome),vuoti=R.prodotti.filter(p=>!p.nome);
    pieni.forEach(function(x){if(!x.formulato){const f=formulatoDaNome(x.nome);if(f)x.formulato=f;}});
    pieni.sort((a,b)=>pesoFormulato(a.formulato)-pesoFormulato(b.formulato));
    R.prodotti=pieni.concat(vuoti);
    const senza=pieni.filter(x=>!x.formulato);
    R.avvisoOrdine=senza.length?senza.map(x=>x.nome):null;
    disegnaRicetta(false);
    avviso(senza.length?senza.length+" senza formulato: controlla":"Riordinati per sequenza di miscela");
    return;
  }
  const mAgg=t.closest("[data-met-agg]");
  if(mAgg){
    leggiRicetta();
    const i=+mAgg.dataset.metAgg,m=R.meteo[i];
    if(m){m.fonte="";aggiornaCampiMeteo();
      const l=luogoMeteo(m.luogoId)||{id:m.luogoId,nome:m.nome,lat:m.lat,lon:m.lon};
      chiediMeteo(l,true).then(function(g){
        const v=g[R.data||oggiISO()];
        if(!v){m.fonte="fuori";m.gg=R.data;aggiornaCampiMeteo();avviso("Giorno fuori dalla previsione");return;}
        METEO_CAMPI.forEach(function(k){m[k]=fmtT(v[k]);});
        m.fonte="auto";m.gg=R.data;aggiornaCampiMeteo();avviso("Meteo aggiornato");
      }).catch(function(e){m.fonte="niente";aggiornaCampiMeteo();avviso("Non scaricato: "+e.message);});
    }
    return;
  }
  const mDel=t.closest("[data-met-del]");
  if(mDel){leggiRicetta();R.meteo.splice(+mDel.dataset.metDel,1);disegnaRicetta(false);return;}
  const mAdd=t.closest("[data-met-add]");
  if(mAdd){
    leggiRicetta();
    const l=luogoMeteo(mAdd.dataset.metAdd);
    if(l){R.meteo.push(rigaMeteoDa(l));disegnaRicetta(false);compilaMeteoRicetta(true);}
    return;
  }
  if(t.closest("[data-met-tutti]")){leggiRicetta();compilaMeteoRicetta(true);avviso("Riscarico il meteo\u2026");return;}
  if(t.closest("[data-met-pagina]")){leggiRicetta();apriMeteo("ricetta");return;}
  if(t.closest("[data-info]")){leggiRicetta();infoMiscela();return;}
  if(t.closest("[data-genera]")){apriGenera();return;}
});

$("#p-ricetta").addEventListener("input",function(e){
  const el=e.target;
  if(PICK&&el.id==="r-"+PICK){
    const box=$('#p-ricetta [data-lista="'+PICK+'"]');
    if(box)box.innerHTML=righePick(PICK,el.value.trim());
    return;
  }
  const mk=el.dataset.met;
  if(mk){
    const i=+el.dataset.i;
    if(R.meteo&&R.meteo[i]){
      R.meteo[i][mk]=el.value.trim();
      R.meteo[i].fonte="manuale";
      const f=$('#r-meteo [data-met-fonte="'+i+'"]');
      if(f)f.innerHTML=meteoFonteHTML(R.meteo[i]);
    }
    return;
  }
  const p=el.dataset.p;if(!p)return;
  const i=+el.dataset.i,prod=R.prodotti[i];if(!prod)return;
  if(p==="nome"){
    prod.nome=el.value;
    const q=el.value.trim();
    const l=(DB.prodotti||[]).filter(x=>norm(x.nome).indexOf(norm(q))>=0).slice(0,8).map(x=>x.nome);
    mostraSugg($('#r-prod [data-sug="'+i+'"]'),l,function(nome){
      leggiRicetta();
      const noto=prodottoNoto(nome);
      R.prodotti[i].nome=nome;
      if(noto){
        if(noto.formulato)R.prodotti[i].formulato=noto.formulato;
        else{const f=formulatoDaNome(nome);if(f)R.prodotti[i].formulato=f;}
        if(noto.dose){R.prodotti[i].dose=noto.dose;R.prodotti[i].unita=noto.unita||"";R.prodotti[i].ok=false;R.prodotti[i].auto=true;}
      }
      disegnaRicetta(false);
      if(noto&&noto.dose)avviso("Dose precompilata: confermala toccandola");
    },q);
  } else if(p==="dose"){
    prod.dose=el.value;confermaDose(el);
    if(!prod.ok){prod.ok=true;el.classList.remove("dubbia");el.classList.add("certa");}
  } else if(p==="formulato"){
    prod.formulato=el.value;
    if(prod.nome&&el.value.trim()){
      const e=prodottoNoto(prod.nome);
      if(e&&e.formulato!==el.value.trim()){e.formulato=el.value.trim();salva();}
    }
    if(R.avvisoOrdine){R.avvisoOrdine=R.avvisoOrdine.filter(x=>x!==prod.nome);if(!R.avvisoOrdine.length)R.avvisoOrdine=null;}
  }
});

function impApplica(){

    const i=+el.dataset.i,k=el.dataset.campo,val=el.value;
    if(v==="home"){c.menu[i][k]=val;}

    else if(v==="fasi"){const co=coltura(IMP.arg);if(co&&k==="fase")co.fasi[i]=val;}
    else if(v==="avversita"){if(k==="nome")DB.avversita[i].nome=val;}

      if(k==="azienda"&&val.trim()&&val!==DB.aziende[i]){
        const vecchio=DB.aziende[i];
        DB.voci.forEach(function(x){x.aziende=(aziendeDi(x)).map(a=>a===vecchio?val:a);});
        DB.aziende[i]=val;

    else if(v==="modi"){if(k==="nome")c.modi[i].nome=val;}
    else if(v==="basi"){c.modi[IMP.arg].basi[i][k]=val;}
    else if(v==="unita"||v==="formulati"){c[v][i]=val;}
    else if(v==="ordine"){if(k==="n")c.ordine[i].n=val;else if(k==="f")c.ordine[i].f=val.split(",").map(x=>x.trim()).filter(Boolean);}
    else if(v==="restrizioni"){
      if(k==="prod")c.restrizioni[i].prod=val.split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);
      else if(k==="testo")c.restrizioni[i].testo=val;

function trovaScheda(nome){
  const n=norm(nome),mm=String(nome).match(/\(([^)]+)\)/),sci=mm?norm(mm[1]):"";
  const tok=function(t){return norm(t).split(" ").filter(w=>w.length>=4);};
  const tn=tok(String(nome).replace(/\([^)]*\)/g,""));
  for(let i=0;i<SCHEDE.length;i++){
    const s=SCHEDE[i],chiavi=[s.n].concat(String(s.s).split(","));
    for(let j=0;j<chiavi.length;j++){
      const nk=norm(chiavi[j]);if(!nk)continue;
      if(nk===n)return s;
      if(sci&&sci.length>=6&&(nk===sci||nk.indexOf(sci)>=0||sci.indexOf(nk)>=0))return s;
    }
    const ts=tok(s.n);
    if(tn.length&&ts.length&&tn.filter(w=>ts.indexOf(w)>=0).length/Math.min(tn.length,ts.length)>=0.7)return s;
  }
  return null;
}
function caricaRicetteBase(){
  if(DB.semiCaricati)return 0;
  const A=new Date().getFullYear();
  let n=0;
  RICETTE_BASE.forEach(function(r){
    if(DB.voci.some(v=>v.titolo===r.tit))return;
    const avv=(r.avv||[]).map(function(k){
      const a=DB.avversita.find(x=>x.schedaId===k)||DB.avversita.find(x=>norm(x.nome)===norm(k));
      return a?a.id:null;
    }).filter(Boolean);
    let data;
    if(r.mese) data=A+"-"+String(r.mese).padStart(2,"0")+"-"+String(r.giorno||1).padStart(2,"0");
    else data=A+"-04-01";
    DB.voci.push({id:nuovoId(),tipo:"Ricetta",modo:r.modo,base:r.base,data:data,
      coltura:r.col,colture:[r.col],varieta:r.var||[],aziende:r.az?[r.az]:[],avversita:avv,fase:r.fase||"",
      tag:(r.tag||[]).concat(["schema"]),titolo:r.tit,
      prodotti:r.prod.map(x=>({nome:x[0],formulato:"",dose:x[1],unita:x[2],ok:true,auto:false})),
      testo:r.note||"",allegati:[],pin:false,creato:Date.now()-n,modificato:Date.now()});
    n++;
  });
  DB.semiCaricati=true;
  return n;
}
function migra(){
  DB.noteSchede=DB.noteSchede||{};DB.prodotti=DB.prodotti||[];DB.aziende=DB.aziende||[];
  DB.colture=DB.colture||[];DB.avversita=DB.avversita||[];DB.voci=DB.voci||[];
  DB.prodotti.forEach(function(p){
    if(!p.note)p.note=(p.nota?[p.nota]:[]);
    delete p.nota;
    if(!p.categorie)p.categorie=(p.categoria?[p.categoria]:[]);
    delete p.categoria;
  });
  const base=catalogoIniziale();
  if(!DB.colture.length)DB.colture=base.colture;
  base.colture.forEach(function(c){if(!DB.colture.some(x=>x.id===c.id))DB.colture.push(c);});
  const presi={};
  DB.avversita.forEach(function(a){if(a.schedaId)presi[a.schedaId]=1;});
  DB.avversita.forEach(function(a){
    if(a.schedaId)return;
    const s=trovaScheda(a.nome);
    if(s&&!presi[s.id]){a.schedaId=s.id;presi[s.id]=1;}
  });
  SCHEDE.forEach(function(s){
    if(presi[s.id])return;
    DB.avversita.push({id:"s-"+s.id,nome:s.n,colture:s.col.slice(),gruppo:NOMI_CAT[s.cat],schedaId:s.id});
    presi[s.id]=1;
  });
  DB.voci.forEach(function(v){
    if(!v.aziende)v.aziende=aziendeDi(v);
    if(!v.colture)v.colture=coltureDi(v);
    if(!Array.isArray(v.varieta))v.varieta=varietaDi(v);
    (v.prodotti||[]).forEach(function(p){if(p.ok===undefined)p.ok=true;});
    if(!v.modo&&(v.prodotti||[]).filter(p=>p.nome).length){v.modo="fogliare";v.base="1000";}
    if(!v.titolo)v.titolo="Voce del "+dataIt(v.data);
    if(!Array.isArray(v.meteo))v.meteo=[];
  });
  caricaRicetteBase();
  DB.voci.forEach(registraProdotti);
  if(!DB.colture.some(c=>c.id===S.coltura))S.coltura=(DB.colture[0]||{}).id||"ara";
  if(!DB.menuApertoTuttiModi){
    const cm=cfg().menu;
    DEF_MENU.forEach(function(d){ if(!cm.some(x=>x.k===d.k)) cm.splice(DEF_MENU.indexOf(d),0,Object.assign({vis:true},d)); });
    cm.forEach(function(m){ if(m.k==="ric-diserbante"||m.k==="ric-speciale") m.vis=true; });
    DB.menuApertoTuttiModi=true;
  }
  DB.v=3;
}
/* ============================================================
   16. NUMERAZIONE BLOCCHI — riferimento per chiedere modifiche
   Assegna un numero visibile (badge) a ogni elemento cliccabile e a
   ogni scheda/riga compilabile visibile a schermo, ripartendo da 1
   a ogni cambio di schermata. Attivo/disattivo con il bottone "#" in
   basso a destra; per default \u00e8 spento e non interferisce con l'uso
   normale. Selettore volutamente ampio: bottoni, select, link con
   data-vai-scheda, righe .scheda, .prod, .ri-edit, .cal-tap.
   ============================================================ */
const SEL_BLOCCHI="button, select, a[data-vai-scheda], .scheda, .prod, .ri-edit, .cal-tap, .met-riga, .met-luogo";
let BLOCCHI_ON=false, OSS_BLOCCHI=null;
function rinumeraBlocchi(){
  if(!BLOCCHI_ON)return;
  if(OSS_BLOCCHI)OSS_BLOCCHI.disconnect();
  document.querySelectorAll(".blocco-badge").forEach(function(b){b.remove();});
  document.querySelectorAll(".has-blocco").forEach(function(b){b.classList.remove("has-blocco");});
  document.querySelectorAll(".blocco-wrap").forEach(function(w){
    const inner=w.firstElementChild;
    if(inner&&w.parentNode){w.parentNode.insertBefore(inner,w);w.remove();}
  });
  const radici=[];
  const header=document.querySelector("header.top");if(header)radici.push(header);
  const tabBasso=document.querySelector("#tab-basso");if(tabBasso)radici.push(tabBasso);
  document.querySelectorAll("main.wrap > div").forEach(function(el){if(!el.hidden)radici.push(el);});
  document.querySelectorAll(".pannello").forEach(function(el){if(!el.hidden)radici.push(el);});
  $("#btn-blocchi") && radici.push($("#btn-blocchi"));
  let n=0;
  radici.forEach(function(root){
    root.querySelectorAll(SEL_BLOCCHI).forEach(function(el){
      n++;
      const badge=document.createElement("span");
      badge.className="blocco-badge";badge.textContent=n;
      if(el.tagName==="SELECT"){
        const wrap=document.createElement("span");
        wrap.className="blocco-wrap has-blocco";
        el.parentNode.insertBefore(wrap,el);
        wrap.appendChild(el);
        wrap.appendChild(badge);
      }else{
        el.classList.add("has-blocco");
        el.appendChild(badge);
      }
    });
  });
  if(OSS_BLOCCHI)OSS_BLOCCHI.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["hidden"]});
}
$("#btn-blocchi").addEventListener("click",function(){
  BLOCCHI_ON=!BLOCCHI_ON;
  document.body.classList.toggle("modalita-blocchi",BLOCCHI_ON);
  $("#btn-blocchi").classList.toggle("on",BLOCCHI_ON);
  if(BLOCCHI_ON)rinumeraBlocchi();
  else{
    document.querySelectorAll(".blocco-badge").forEach(function(b){b.remove();});
    document.querySelectorAll(".has-blocco").forEach(function(b){b.classList.remove("has-blocco");});
    document.querySelectorAll(".blocco-wrap").forEach(function(w){
      const inner=w.firstElementChild;
      if(inner&&w.parentNode){w.parentNode.insertBefore(inner,w);w.remove();}
    });
  }
});
OSS_BLOCCHI=new MutationObserver(function(){clearTimeout(window.__bT);window.__bT=setTimeout(rinumeraBlocchi,80);});

/* ============================================================
   17. NOTE SUL PUNTO — la chiocciola in basso a destra
   Serve ad Alfio per indicare una modifica toccando il punto dello
   schermo invece di descriverlo a parole. Acceso il tasto @, ogni
   tocco apre una nuvoletta: la nota viene salvata insieme al numero
   di blocco, al nome della schermata e a una descrizione
   dell'elemento toccato. Dall'elenco si copia tutto in un colpo.
   La numerazione blocchi si accende da sola: e' l'ancora della nota.
   Il tasto "Naviga" sospende la cattura dei tocchi, cosi' si puo'
   cambiare schermata senza spegnere la modalita'.
   ============================================================ */
let NOTE_ON=false, NOTE_NAVIGA=false, NOTA_APERTA=null, NOTE_RITORNO=null;

function noteApp(){DB.noteApp=DB.noteApp||[];return DB.noteApp;}

function nomeSchermata(){
  const pan=$$(".pannello").filter(function(x){return !x.hidden;});
  if(pan.length){
    const id=pan[pan.length-1].id;
    const nomi={"p-lettura":"Lettura voce","p-editor":"Appunto","p-impostazioni":"Impostazioni",
      "p-scheda":"Scheda del consultorio","p-ricetta":"Ricetta","p-info":"Ordine di miscela",
      "p-genera":"Genera ricetta","p-appunto":"Appunto","p-meteo":"Meteo","p-note":"Note"};
    let n=nomi[id]||id;
    if(id==="p-ricetta")n+=" \u00b7 passo "+PASSO+" "+((PASSI[PASSO-1]||{}).t||"");
    if(id==="p-impostazioni")n+=" \u00b7 "+IMP.vista;
    return n;
  }
  const nomi={home:"Home",storico:"Storico / QDCA",suggerimenti:"Suggerimenti del mese",
    consultorio:"Consultorio",prodotti:"Banca Dati"};
  return nomi[sezione]||sezione;
}
function testoPulito(el){
  const c=el.cloneNode(true);
  c.querySelectorAll(".blocco-badge, .bm-n, .n-conta").forEach(function(x){x.remove();});
  return (c.textContent||"").replace(/\s+/g," ").trim();
}
function descriviElemento(el){
  if(!el||el===document.body)return "sfondo della pagina";
  const t=el.tagName.toLowerCase();
  let txt=(el.getAttribute("aria-label")||el.getAttribute("placeholder")||
    (el.value!==undefined&&t!=="select"?el.value:"")||testoPulito(el)).replace(/\s+/g," ").trim();
  if(t==="select"&&el.options&&el.selectedIndex>=0)txt=el.options[el.selectedIndex].text;
  if(txt.length>70)txt=txt.slice(0,70)+"\u2026";
  const cls=(el.className&&typeof el.className==="string")
    ?el.className.split(/\s+/).filter(function(c){return c&&c.indexOf("has-blocco")<0&&c.indexOf("blocco-")<0;}).slice(0,2).join(".")
    :"";
  return t+(cls?"."+cls:"")+(txt?' \u00ab'+txt+'\u00bb':"");
}
function bloccoDi(el){
  if(!el||!el.closest)return null;
  function leggi(){
    const b=el.closest(".has-blocco");
    if(!b)return null;
    const badge=b.querySelector(":scope > .blocco-badge");
    return badge?badge.textContent:null;
  }
  let n=leggi();
  if(n===null&&BLOCCHI_ON){rinumeraBlocchi();n=leggi();}
  return n;
}
function chiudiBolla(){
  NOTA_APERTA=null;
  const v=$(".nota-velo");if(v)v.remove();
  const b=$(".nota-bolla");if(b)b.remove();
  const m=$(".nota-mirino");if(m)m.remove();
}
function apriBolla(x,y,el,esistente){
  chiudiBolla();
  const blocco=esistente?esistente.blocco:bloccoDi(el);
  const dove=esistente?esistente.schermata:nomeSchermata();
  const elDesc=esistente?esistente.elemento:descriviElemento(el);
  NOTA_APERTA={id:esistente?esistente.id:null,blocco:blocco,schermata:dove,elemento:elDesc};

  const velo=document.createElement("div");velo.className="nota-velo";
  document.body.appendChild(velo);

  const mir=document.createElement("div");mir.className="nota-mirino";
  mir.style.left=x+"px";mir.style.top=y+"px";
  document.body.appendChild(mir);

  const bolla=document.createElement("div");bolla.className="nota-bolla";
  bolla.innerHTML=
    '<div class="nb-dove">'+esc(dove)+(blocco?" \u00b7 blocco "+esc(blocco):"")+'</div>'+
    '<div class="nb-el">'+esc(elDesc)+'</div>'+
    '<textarea id="nota-testo" placeholder="Cosa vuoi che cambi qui\u2026"></textarea>'+
    '<div class="nb-az">'+
      (esistente?'<button class="rm" data-nota-elimina>Elimina</button>':"")+
      '<button data-nota-annulla>Annulla</button>'+
      '<button class="ok" data-nota-salva>Salva</button>'+
    '</div>';
  document.body.appendChild(bolla);
  const w=bolla.offsetWidth,h=bolla.offsetHeight;
  let bx=Math.min(Math.max(8,x-w/2),window.innerWidth-w-8);
  let by=y+22;
  if(by+h>window.innerHeight-8)by=Math.max(8,y-h-22);
  bolla.style.left=bx+"px";bolla.style.top=by+"px";
  const ta=$("#nota-testo");
  if(ta){ta.value=esistente?esistente.testo:"";setTimeout(function(){ta.focus();},60);}
}
function salvaNota(){
  const ta=$("#nota-testo");
  const testo=ta?ta.value.trim():"";
  if(!testo){avviso("Scrivi qualcosa, o tocca Annulla");return;}
  const l=noteApp();
  if(NOTA_APERTA.id){
    const n=l.find(function(x){return x.id===NOTA_APERTA.id;});
    if(n){n.testo=testo;n.modificato=Date.now();}
  }else{
    l.push({id:nuovoId(),t:Date.now(),schermata:NOTA_APERTA.schermata,
      blocco:NOTA_APERTA.blocco,elemento:NOTA_APERTA.elemento,testo:testo});
  }
  salva();chiudiBolla();aggiornaContaNote();
  avviso(NOTA_APERTA&&NOTA_APERTA.blocco?"Nota salvata sul blocco "+NOTA_APERTA.blocco:"Nota salvata");
}
function aggiornaContaNote(){
  const b=$("#btn-note");if(!b)return;
  const n=noteApp().length;
  b.innerHTML="@"+(n?'<span class="n-conta">'+n+'</span>':"");
  const bar=$(".nota-barra .nb-t");
  if(bar)bar.textContent="Note sul punto \u00b7 "+n;
}
function barraNote(){
  let bar=$(".nota-barra");
  if(!NOTE_ON){if(bar)bar.remove();return;}
  if(!bar){
    bar=document.createElement("div");bar.className="nota-barra";
    document.body.appendChild(bar);
  }
  bar.innerHTML='<span class="nb-t">Note sul punto \u00b7 '+noteApp().length+'</span>'+
    '<button class="'+(NOTE_NAVIGA?"":"att")+'" data-nota-modo="annota">Annota</button>'+
    '<button class="'+(NOTE_NAVIGA?"att":"")+'" data-nota-modo="naviga">Naviga</button>'+
    '<button data-nota-elenco>Elenco</button>'+
    '<button data-nota-esci>Esci</button>';
}
function accendiNote(v){
  NOTE_ON=v;NOTE_NAVIGA=false;
  document.body.classList.toggle("modalita-note",NOTE_ON);
  document.body.classList.remove("naviga");
  $("#btn-note").classList.toggle("on",NOTE_ON);
  if(NOTE_ON&&!BLOCCHI_ON)$("#btn-blocchi").click();
  if(!NOTE_ON)chiudiBolla();
  barraNote();aggiornaContaNote();
  if(NOTE_ON)avviso("Tocca un punto dello schermo per scrivere una nota");
}
function testoNote(){
  const l=noteApp();
  if(!l.length)return "";
  const r=["NOTE SUL QUADERNO \u2014 "+VERSIONE_APP,
    "Scritte da Alfio toccando i punti dello schermo. Il numero di blocco",
    "\u00e8 quello che compare con il tasto # acceso.",""];
  const gruppi={};
  l.forEach(function(n){(gruppi[n.schermata]=gruppi[n.schermata]||[]).push(n);});
  let i=0;
  Object.keys(gruppi).forEach(function(k){
    r.push("### "+k);
    gruppi[k].forEach(function(n){
      i++;
      r.push(i+") "+(n.blocco?"blocco "+n.blocco+" \u2014 ":"")+n.elemento);
      r.push("   "+n.testo.split("\n").join("\n   "));
    });
    r.push("");
  });
  return r.join("\n");
}
function disegnaNote(){
  const l=noteApp().slice().sort(function(a,b){return a.t-b.t;});
  const gruppi={};
  l.forEach(function(n){(gruppi[n.schermata]=gruppi[n.schermata]||[]).push(n);});
  $("#p-note").innerHTML=
  '<div class="barra-p"><button class="indietro" data-nota-chiudi>\u2039 Indietro</button>'+
  '<span class="titolo-p">Note</span><span style="width:60px"></span></div>'+
  '<div class="wrap"><div class="testata"><div class="tipo-d">'+l.length+' '+(l.length===1?"nota":"note")+'</div>'+
  '<h2>Quello che hai segnato</h2>'+
  '<p class="suggerimento" style="font-size:13px">Tocca «Copia tutto» e incolla nella chat: ricevo schermata, numero di blocco, elemento toccato e il tuo testo, cos\u00ec so esattamente dove intervenire.</p></div>'+
  (l.length?Object.keys(gruppi).map(function(k){
    return '<div class="imp-sez">'+esc(k)+'</div>'+gruppi[k].map(function(n){
      return '<div class="nota-c" data-id="'+esc(n.id)+'">'+
        '<div class="nc-h">'+(n.blocco?"blocco "+esc(n.blocco):"punto libero")+'</div>'+
        '<div class="nc-el">'+esc(n.elemento)+'</div>'+
        '<div class="nc-t">'+esc(n.testo)+'</div>'+
        '<div class="nc-az"><button class="mini" data-nota-mod="'+esc(n.id)+'">Modifica</button>'+
        '<button class="mini" data-nota-rm="'+esc(n.id)+'">Elimina</button></div></div>';
    }).join("");
  }).join(""):'<p class="suggerimento" style="margin:16px 0">Nessuna nota. Accendi la chiocciola in basso a destra e tocca il punto che vuoi commentare.</p>')+
  (l.length?'<div class="met-az" style="margin-top:16px">'+
    '<button class="mini" data-nota-copia>Copia tutto</button>'+
    '<button class="mini" data-nota-condividi>Condividi</button>'+
    '<button class="mini" data-nota-svuota>Cancella tutte</button></div>'+
    '<p class="suggerimento" style="margin-top:14px">Se il tasto Copia non funziona, tieni premuto qui sotto e copia a mano.</p>'+
    '<textarea id="nota-export" readonly>'+esc(testoNote())+'</textarea>':"")+
  '<div style="height:44px"></div></div>';
}
function apriNote(){disegnaNote();mostraPannello($("#p-note"));}
function chiudiNote(){
  if(NOTE_RITORNO==="imp"){NOTE_RITORNO=null;apriImp("menu");return;}
  chiudiPannelli();vaiA(sezione||"home");
}

/* ---- cattura dei tocchi ---- */
const NOTE_LIBERI="#btn-note, #btn-blocchi, .nota-bolla, .nota-barra, .nota-velo, #p-note, .toast";
document.addEventListener("click",function(e){
  if(!NOTE_ON||NOTE_NAVIGA)return;
  const t=e.target;
  if(t.closest&&t.closest(NOTE_LIBERI))return;
  e.preventDefault();e.stopPropagation();
  apriBolla(e.clientX||Math.round(window.innerWidth/2),
            e.clientY||Math.round(window.innerHeight/2),t,null);
},true);
document.addEventListener("mousedown",function(e){
  if(!NOTE_ON||NOTE_NAVIGA)return;
  if(e.target.closest&&e.target.closest(NOTE_LIBERI))return;
  e.preventDefault();e.stopPropagation();
},true);

$("#btn-note").addEventListener("click",function(e){
  e.stopPropagation();
  accendiNote(!NOTE_ON);
});
document.addEventListener("click",function(e){
  const t=e.target;
  if(t.closest("[data-nota-salva]")){salvaNota();return;}
  if(t.closest("[data-nota-annulla]")){chiudiBolla();return;}
  if(t.closest("[data-nota-elimina]")){
    if(NOTA_APERTA&&NOTA_APERTA.id){
      DB.noteApp=noteApp().filter(function(x){return x.id!==NOTA_APERTA.id;});
      salva();
    }
    chiudiBolla();aggiornaContaNote();
    if(!$("#p-note").hidden)disegnaNote();
    return;
  }
  if(t.classList&&t.classList.contains("nota-velo")){chiudiBolla();return;}
  const md=t.closest("[data-nota-modo]");
  if(md){
    NOTE_NAVIGA=(md.dataset.notaModo==="naviga");
    document.body.classList.toggle("naviga",NOTE_NAVIGA);
    barraNote();
    avviso(NOTE_NAVIGA?"Naviga liberamente, la modalit\u00e0 resta accesa":"Tocca un punto per annotarlo");
    return;
  }
  if(t.closest("[data-nota-elenco]")){NOTE_RITORNO=null;apriNote();return;}
  if(t.closest("[data-nota-esci]")){accendiNote(false);return;}
  if(t.closest("[data-nota-chiudi]")){chiudiNote();return;}
  const nm=t.closest("[data-nota-mod]");
  if(nm){
    const n=noteApp().find(function(x){return x.id===nm.dataset.notaMod;});
    if(n)apriBolla(Math.round(window.innerWidth/2),Math.round(window.innerHeight/3),null,n);
    return;
  }
  const nr=t.closest("[data-nota-rm]");
  if(nr){
    DB.noteApp=noteApp().filter(function(x){return x.id!==nr.dataset.notaRm;});
    salva();disegnaNote();aggiornaContaNote();return;
  }
  if(t.closest("[data-nota-copia]")){
    const txt=testoNote();
    const fatto=function(){avviso("Note copiate: incollale nella chat");};
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(fatto).catch(function(){
        const ta=$("#nota-export");if(ta){ta.select();avviso("Copia a mano dal riquadro");}
      });
    else{const ta=$("#nota-export");if(ta){ta.select();avviso("Copia a mano dal riquadro");}}
    return;
  }
  if(t.closest("[data-nota-condividi]")){
    const txt=testoNote();
    if(navigator.share)navigator.share({title:"Note sul Quaderno",text:txt}).catch(function(){});
    else{const ta=$("#nota-export");if(ta){ta.select();avviso("Condivisione non disponibile: copia a mano");}}
    return;
  }
  if(t.closest("[data-nota-svuota]")){
    if(!confirm("Cancellare tutte le note?"))return;
    DB.noteApp=[];salva();disegnaNote();aggiornaContaNote();return;
  }
});

(function(){
  Archivio.leggi().then(function(s){
    if(s&&s.voci){DB=s;migra();}
    else{const c=catalogoIniziale();DB={v:3,colture:c.colture,avversita:c.avversita,voci:[],prodotti:[],aziende:[],noteSchede:{}};}
    Archivio.scrivi(DB);
    disegnaColture();
    vaiA("home");
    aggiornaContaNote();
  });
})();
